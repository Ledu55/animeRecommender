<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Anime Recommender{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f6f8; --card: #ffffff; --text: #1d1d22; --muted: #6b6b76;
      --accent: #2e51a2; --chip: #e9ecf5; --border: #e3e3ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121216; --card: #1c1c22; --text: #ececf1; --muted: #9a9aa6;
        --accent: #8aa7ff; --chip: #2a2f40; --border: #2c2c35;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header, main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    header { padding-bottom: 8px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .meta { color: var(--muted); margin: 0; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
    .card:hover { border-color: var(--accent); }
    .card img { width: 100%; aspect-ratio: 225 / 320; object-fit: cover; background: var(--chip); }
    .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .title { font-weight: 600; margin: 0; }
    .stats { color: var(--muted); font-size: 0.85rem; display: flex; justify-content: space-between; }
    .match { color: var(--accent); font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
    .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 0.75rem; }
    .empty { color: var(--muted); }
    nav { display: flex; gap: 16px; margin-top: 8px; }
    nav a { color: var(--accent); text-decoration: none; font-weight: 600; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--border); border-radius: 8px;
             background: var(--chip); color: var(--text); padding: 6px 10px; }
    button:hover { border-color: var(--accent); }
    .primary { background: var(--accent); color: var(--card); border-color: var(--accent); }
    .actions { display: flex; gap: 6px; }
    .actions button { flex: 1; }
    .notice { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .rated { opacity: 0.35; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>Anime Recommender</h1>
    {% block header %}{% endblock %}
    {% if interactive %}
    <nav><a href="/">Recommendations</a><a href="/rate">Rate anime</a></nav>
    {% endif %}
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>

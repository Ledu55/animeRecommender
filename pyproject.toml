[project]
name = "animerec"
version = "2.0.0"
description = "Anime recommender trained on your own MyAnimeList scores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "joblib>=1.4",
    "lightgbm>=4.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "nbstripout>=0.7"]

[project.scripts]
animerec = "animerec.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["animerec"]

[tool.setuptools.package-data]
animerec = ["templates/*.html"]

[tool.ruff]
line-length = 110
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
